name: Validar compilacao Reparos
on:
  push:
    branches:
      - diagnostics/reparos-build
    paths:
      - '.github/workflows/diagnostico-reparos-build.yml'
      - 'frontend-react/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend-react
        run: npm ci
      - name: Compilar frontend
        working-directory: frontend-react
        run: npm run build
